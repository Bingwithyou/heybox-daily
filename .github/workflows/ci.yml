name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: docker compose build heybox login
      - name: Check image entrypoint without account credentials
        run: docker run --rm --tmpfs /app/state heybox-daily-heybox help
      - name: Check login image entrypoint
        run: docker run --rm --tmpfs /app/state heybox-daily-login help
      - name: Sign offline with bundled resources and no account
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:exec,size=512m
          --entrypoint node -v "$PWD/test:/app/test:ro"
          heybox-daily-heybox --test test/native-smoke.ts
