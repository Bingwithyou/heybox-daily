name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: docker compose build
      - name: Check image entrypoint without account credentials
        run: docker run --rm --tmpfs /app/state heybox-daily-heybox help
