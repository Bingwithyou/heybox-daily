name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm --filter @heybox/login-relay typecheck
      - run: pnpm --filter @heybox/login-relay test
      - run: pnpm --filter @heybox/login-relay test:runtime
      - run: pnpm --filter @heybox/runner typecheck
      - run: pnpm --filter @heybox/runner test
      - run: pnpm --filter @heybox/executor typecheck
      - run: pnpm --filter @heybox/executor test
      - run: pnpm --filter @heybox/executor test:runtime
      - run: pnpm --filter @heybox/web test
      - run: pnpm --filter @heybox/web build
      - run: pnpm --filter @heybox/web typecheck
      - run: pnpm --filter @heybox/web lint
      - run: pnpm --filter @heybox/web format:check
      - run: pnpm --filter @heybox/web test:integration
      - run: docker compose build heybox login
      - run: docker build --target runner -t heybox-daily-runner:ci .
      - name: Check image entrypoint without account credentials
        run: docker run --rm --tmpfs /app/state heybox-daily-heybox help
      - name: Check login image entrypoint
        run: docker run --rm --tmpfs /app/state heybox-daily-login help
      - name: Sign offline without Java, Android resources or an account
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:exec,size=512m
          --entrypoint node -v "$PWD/test:/app/test:ro"
          heybox-daily-heybox --test test/native-smoke.ts
      - name: Check runner process, encryption and login boundaries offline
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:exec,size=512m
          --entrypoint node -v "$PWD/apps/runner/test:/app/apps/runner/test:ro"
          -v "$PWD/apps/login-relay/src:/app/apps/login-relay/src:ro"
          heybox-daily-runner:ci --test apps/runner/test/*.test.ts
