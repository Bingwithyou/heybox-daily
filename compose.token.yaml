services:
  token:
    build:
      context: .
      target: token-service
    init: true
    restart: unless-stopped
    read_only: true
    env_file: ./private/token.env
    environment:
      TOKEN_PREWARM: ${TOKEN_PREWARM:-true}
    ports:
      - "127.0.0.1:8789:8789"
    tmpfs:
      - /tmp:exec,size=256m
    mem_limit: 1g
    cpus: 2
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
