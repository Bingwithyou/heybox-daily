services:
  heybox:
    build:
      context: .
      target: runtime
    init: true
    restart: "no"
    read_only: true
    volumes:
      - ./private:/app/private:ro
      - ./state:/app/state
    tmpfs:
      - /tmp:exec,size=512m
    mem_limit: 768m
    cap_drop:
      - ALL
    cap_add:
      # Read private files owned by the host user and write the mounted state directory.
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
  login:
    build:
      context: .
      target: login
    profiles: [setup]
    init: true
    restart: "no"
    stdin_open: true
    tty: true
    read_only: true
    volumes:
      - ./private:/app/private
      - ./state:/app/state
    tmpfs:
      - /tmp:exec,size=512m
    mem_limit: 1g
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
