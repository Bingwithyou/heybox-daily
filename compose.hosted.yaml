services:
  runner:
    build:
      context: .
      target: runner
    init: true
    restart: unless-stopped
    read_only: true
    env_file: ./private/runner.env
    ports:
      - "127.0.0.1:8788:8788"
    tmpfs:
      - /tmp:exec,size=1g
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5m
  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    env_file: ./private/tunnel.env
    depends_on: [runner]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
